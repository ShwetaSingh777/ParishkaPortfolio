<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
       
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: "Pixelify Sans", sans-serif;
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;

    /* ✅ Custom cursor */
    cursor: url("Images/Home_Page/DICE_CURSOR.png") 16 16, default;
}

h1 {
    font-size: 80px;
    margin-bottom: 40px;
      animation: colorCycle 1s steps(1, end) infinite;
}

.btn {
    
  display: block;
  width: 360px;
  padding: 18px 0;
  margin: 15px 0;
  text-align: center;
  font-size: 30px;
  text-decoration: none;
  color: black; /* stays black */
  border: 3px solid;
  border-radius: 10px;
   animation: buttonCycle 1s steps(1, end) infinite;


    /* ✅ Cursor on buttons */
    cursor: url("Images/Home_Page/DICE_CURSOR_02.png") 16 16, pointer !important;
}

.btn:hover {
  transform: scale(1.05);
}


.btn:hover {
    background: black;
    color: whitesmoke;
}



@keyframes colorCycle {
  0%   { color: #a5211c; }
  25%  { color: #ce931d; }
  50%  { color: #135633; }
  75%  { color: #204a92; }
  100% { color: #a5211c; }
}

@keyframes buttonCycle {
  0%   { background: #a5211c; border-color: #a5211c; }
  25%  { background: #ce931d; border-color: #ce931d; }
  50%  { background: #135633; border-color: #135633; }
  75%  { background: #204a92; border-color: #204a92; }
  100% { background: #a5211c; border-color: #a5211c; }
}

         
 /* ------------------ REAL MOBILE FIX (2×2 grid) ------------------ */
        @media (max-width: 768px) {
            h1 {
    font-size: 60px;}
    .btn {

  width: 250px;}

        }


    </style>

</head>
<body>
